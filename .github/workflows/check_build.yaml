# Check that the program can be built,
# that its tests pass and measure the code coverage
name: Check build

on:
  push:
    paths:
      - .github/workflows/check_build.yaml
      - "**.cpp"
      - "**.h"
      - "**.pro"
      - "**.pri"
      - "**.qrc"
      - "**.ui"
  pull_request:
    paths:
      - .github/workflows/check_build.yaml
      - "**.cpp"
      - "**.h"
      - "**.pro"
      - "**.pri"
      - "**.qrc"
      - "**.ui"

jobs:
  check_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt and other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev

      - name: Build the tests, with code coverage
        run: |
          qmake6 "CONFIG+=debug" "QMAKE_CXXFLAGS+=--coverage" "QMAKE_LFLAGS+=--coverage" boenken_test.pro
          make --silent -j$(nproc)

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./boenken_test

      - name: Measure code coverage
        run: |
          pip install gcovr
          gcovr --root . --exclude '.*_test\.cpp' --exclude '.*moc_.*' --exclude '.*qrc_.*' --exclude '.*ui_.*' --print-summary --xml coverage.xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build the game
        run: |
          make distclean
          qmake6 Boenken.pro
          make --silent -j$(nproc)
